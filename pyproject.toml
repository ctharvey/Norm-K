[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "norm-k"
version = "0.1.0"
description = "Reproducible experiments on geometric signals for contradiction detection"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
research = ["scikit-learn>=1.3", "matplotlib>=3.7"]

[project.scripts]
norm-k = "norm_k.cli:main"

[tool.setuptools.packages.find]
include = ["norm_k*"]

